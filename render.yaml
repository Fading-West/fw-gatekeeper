services:
  - type: web
    name: fw-gatekeeper
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_CONVEX_URL
        value: https://modest-bat-146.convex.cloud
      - key: CONVEX_INGEST_URL
        value: https://modest-bat-146.convex.site
      - key: CONVEX_INGEST_KEY
        sync: false
      - key: KIOSK_API_KEY
        sync: false
      - key: FACE_ENCODE_URL
        value: https://fw-face-service.onrender.com/encode
      - key: FACE_SERVICE_KEY
        sync: false

  - type: web
    name: fw-face-service
    runtime: docker
    plan: free
    dockerfilePath: ./face-service/Dockerfile
    dockerContext: ./face-service
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "5557"
      - key: FACE_SERVICE_KEY
        sync: false
      - key: FACE_SERVICE_ALLOWED_ORIGINS
        value: https://fw-gatekeeper.onrender.com
