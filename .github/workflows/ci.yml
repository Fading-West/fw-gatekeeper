name: Gatekeeper checks
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gatekeeper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_CONVEX_URL: https://ci-only.convex.cloud
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            face-service/requirements.lock
            scripts/requirements-ci.txt
            scripts/requirements-uv.txt
      - name: Install the lockfile compiler
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-uv.txt
      - name: Check the face-service lock is current
        run: |
          uv pip compile face-service/requirements.txt \
            --python-version 3.11 --python-platform x86_64-manylinux_2_36 \
            --generate-hashes --only-binary=:all: \
            --custom-compile-command 'bash scripts/lock-python-dependencies.sh' \
            --output-file face-service/requirements.lock --quiet
          git diff --exit-code -- face-service/requirements.lock
      - run: npm ci
      - name: Install the production face-service runtime
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r face-service/requirements.lock
      - name: Add Python test dependencies without changing locked runtime versions
        # uv applies version constraints without enabling pip's implicit hash mode.
        # Keep this separate from the hash-verified production install above.
        run: uv pip install --python "$(command -v python)" -c face-service/requirements.lock -r scripts/requirements-ci.txt
      - run: npm run lint
      - name: Install headless Chromium for browser-level component tests
        run: npx playwright-core install --with-deps --only-shell chromium
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  face-service-image:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build face service with pinned models and native dependencies
        run: docker build --tag gatekeeper-face-service:ci ./face-service
      - name: Verify non-root user and read-only app and model
        run: |
          docker run --rm gatekeeper-face-service:ci sh -ec '
            test "$(id -u)" = 10001
            test "$(id -g)" = 10001
            test ! -w /app
            test ! -w /app/main.py
            test ! -w /app/models
            test ! -w /app/models/rec_model.onnx
            test -w "$HOME"
            test -w /tmp
          '
      - name: Load recognition model in the built image
        run: docker run --rm gatekeeper-face-service:ci python -c "import main; main.get_rec_session(); print('Recognition model loaded')"
      - name: Start face service with deployment OTEL environment
        shell: bash
        run: |
          set -euo pipefail
          container_name="face-service-startup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then
              docker logs "$container_name" || true
            fi
            docker rm --force "$container_name" >/dev/null || true
            exit "$result"
          }
          trap cleanup EXIT
          docker run --detach --name "$container_name" --publish 127.0.0.1:5557:5557 \
            --env FACE_SERVICE_KEY=ci-startup-key \
            --env OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318 \
            gatekeeper-face-service:ci uvicorn main:app --host 0.0.0.0 --port 5557 >/dev/null
          deadline=$((SECONDS + 90))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 1 --max-time 2 http://127.0.0.1:5557/health || true)" = "200" ]; then
              echo "Face service started and /health returned 200"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_name")" != "true" ]; then
              echo "Face service exited before becoming healthy"
              exit 1
            fi
            sleep 1
          done
          echo "Timed out waiting for face service /health"
          exit 1
