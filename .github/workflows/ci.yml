name: Gatekeeper checks
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gatekeeper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_CONVEX_URL: https://ci-only.convex.cloud
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - run: npm ci
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  face-service-image:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build face service with pinned models and native dependencies
        run: docker build --tag gatekeeper-face-service:ci ./face-service
      - name: Load recognition model in the built image
        run: docker run --rm gatekeeper-face-service:ci python -c "import main; main.get_rec_session(); print('Recognition model loaded')"
      - name: Start face service with deployment OTEL environment
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run --detach --publish 127.0.0.1:5557:5557 \
            --env FACE_SERVICE_KEY=ci-startup-key \
            --env OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318 \
            gatekeeper-face-service:ci uvicorn main:app --host 0.0.0.0 --port 5557)
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then
              docker logs "$container_id" || true
            fi
            docker rm --force "$container_id" >/dev/null || true
            exit "$result"
          }
          trap cleanup EXIT
          deadline=$((SECONDS + 90))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 1 --max-time 2 http://127.0.0.1:5557/health || true)" = "200" ]; then
              echo "Face service started and /health returned 200"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != "true" ]; then
              echo "Face service exited before becoming healthy"
              exit 1
            fi
            sleep 1
          done
          echo "Timed out waiting for face service /health"
          exit 1
