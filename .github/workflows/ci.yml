name: Gatekeeper checks
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gatekeeper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_CONVEX_URL: https://ci-only.convex.cloud
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - run: npm ci
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  face-service-image:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build face service with pinned models and native dependencies
        run: docker build --tag gatekeeper-face-service:ci ./face-service
      - name: Verify non-root user and read-only app and model
        run: |
          docker run --rm gatekeeper-face-service:ci sh -ec '
            test "$(id -u)" = 10001 && test "$(id -g)" = 10001
            test ! -w /app && test ! -w /app/main.py
            test ! -w /app/models && test ! -w /app/models/rec_model.onnx
            test -w "$HOME" && test -w /tmp
          '
      - name: Load recognition model in the built image
        run: docker run --rm gatekeeper-face-service:ci python -c "import main; main.get_rec_session(); print('Recognition model loaded')"
