name: Gatekeeper checks
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gatekeeper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_CONVEX_URL: https://ci-only.convex.cloud
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - run: npm ci
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r face-service/requirements-build.lock
      - run: python -m pip install --no-build-isolation -r scripts/requirements-ci.txt
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  face-service-image:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build face service with pinned models and native dependencies
        run: docker build --tag gatekeeper-face-service:ci ./face-service
      - name: Load recognition model in the built image
        run: docker run --rm gatekeeper-face-service:ci python -c "import main; main.get_rec_session(); print('Recognition model loaded')"
      - name: Verify detector, crops and real embeddings within the Render memory limit
        run: |
          docker run --rm --memory=512m --memory-swap=512m \
            -v "$PWD:/repo:ro" -e FACE_PARITY_MODEL=/app/models/rec_model.onnx \
            gatekeeper-face-service:ci python /repo/face-service/test_crop_parity.py
          docker image inspect gatekeeper-face-service:ci --format 'Runtime image bytes: {{.Size}}'
      - name: Measure maximum-size HTTP enrollment requests within the Render memory limit
        run: |
          docker run --rm --memory=512m --memory-swap=512m -v "$PWD:/repo:ro" \
            gatekeeper-face-service:ci \
            python /repo/scripts/check-face-service-memory.py --model /app/models/rec_model.onnx
